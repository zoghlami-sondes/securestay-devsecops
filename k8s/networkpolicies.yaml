apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-securestay-http
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securestay
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              securestay.io/http-client: "true"
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-client-egress
spec:
  podSelector:
    matchLabels:
      securestay.io/http-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: securestay
      ports:
        - protocol: TCP
          port: 8080
