apiVersion: apps/v1
kind: Deployment
metadata:
  name: securestay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: securestay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securestay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-sqlite
          image: securestay:k8s-local
          imagePullPolicy: Never
          command: ["install", "-d", "-m", "0700", "/sqlite-volume/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: sqlite
              mountPath: /sqlite-volume
      containers:
        - name: flask
          image: securestay:k8s-local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SECURESTAY_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: securestay-config
                  key: SECURESTAY_DATABASE
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securestay-credentials
                  key: ADMIN_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securestay-credentials
                  key: SECRET_KEY
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: sqlite
              mountPath: /app/data
              subPath: data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: securestay-sqlite
        - name: logs
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
