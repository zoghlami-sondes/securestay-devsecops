{% extends "base.html" %}

{% block title %}SecureStay - Login{% endblock %}

{% block content %}

<section class="form-section">
    <h1>Login</h1>

    <form method="POST" class="form">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Login</button>

    </form>
</section>

{% endblock %}
