{% extends "base.html" %}

{% block title %}SecureStay - Reset Password{% endblock %}

{% block content %}

<section class="form-section">

    <h1>Reset Password</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" class="form">

        <label for="token">
            Reset token
        </label>

        <input
            type="text"
            id="token"
            name="token"
            required
        >

        <label for="password">
            New password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Reset password
        </button>

    </form>

</section>

{% endblock %}
