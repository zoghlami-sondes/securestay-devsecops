apiVersion: v1
kind: Namespace
metadata:
  name: securestay-dast
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securestay-deploy
  namespace: securestay-dast
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securestay-dast
  namespace: securestay-dast
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securestay-deploy
  namespace: securestay-dast
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["securestay"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["securestay"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securestay-deploy
  namespace: securestay-dast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: securestay-deploy
subjects:
  - kind: ServiceAccount
    name: securestay-deploy
    namespace: securestay-dast
